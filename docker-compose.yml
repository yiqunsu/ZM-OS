services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: filmos
      POSTGRES_PASSWORD: filmos
      POSTGRES_DB: filmos
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  # Arize Phoenix: OpenTelemetry trace collector + UI for the LangGraph agent.
  # Decoupled sink — the backend just ships traces here; if it's down the API
  # is unaffected. Storage stays in its own volume, isolated from the business DB.
  phoenix:
    image: arizephoenix/phoenix:latest
    ports:
      - "6006:6006"    # UI + OTLP/HTTP (/v1/traces)
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
    volumes:
      - phoenixdata:/mnt/data

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://filmos:filmos@postgres:5432/filmos
      REDIS_URL: redis://redis:6379
      CHAT_ATTACHMENT_DIR: /app/data/chat-attachments
      AGENT_V2_ENABLED: ${AGENT_V2_ENABLED:-true}
      PHOENIX_ENABLED: "true"
      PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:6006
    volumes:
      - chat_attachments:/app/data/chat-attachments
    depends_on:
      - postgres
      - redis
      - phoenix
    networks:
      - default

  agent-worker:
    build: ./backend
    command: [python, -m, app.agent.worker]
    init: true
    restart: unless-stopped
    stop_grace_period: 190s
    healthcheck:
      test: [CMD, python, -m, app.agent.worker, --healthcheck]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://filmos:filmos@postgres:5432/filmos
      AGENT_V2_ENABLED: ${AGENT_V2_ENABLED:-true}
      CHAT_ATTACHMENT_DIR: /app/data/chat-attachments
      PHOENIX_ENABLED: "false"
    volumes:
      - chat_attachments:/app/data/chat-attachments
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
    ports:
      - "3000:3000"
    env_file: ./frontend/.env.local
    environment:
      AGENT_V2_ENABLED: ${AGENT_V2_ENABLED:-true}
    depends_on:
      - backend

volumes:
  pgdata:
  phoenixdata:
  chat_attachments:
