name: deployment-ci

on:
  push:
    branches: [main, development]
    paths:
      - "deploy/**"
      - "backend/Dockerfile"
      - "backend/.dockerignore"
      - "backend/requirements*.txt"
      - "backend/requirements.lock"
      - "frontend/Dockerfile"
      - "frontend/.dockerignore"
      - "frontend/package*.json"
      - ".github/workflows/deployment-ci.yml"
  pull_request:
    branches: [main, development]
    paths:
      - "deploy/**"
      - "backend/Dockerfile"
      - "backend/.dockerignore"
      - "backend/requirements*.txt"
      - "backend/requirements.lock"
      - "frontend/Dockerfile"
      - "frontend/.dockerignore"
      - "frontend/package*.json"
      - ".github/workflows/deployment-ci.yml"

jobs:
  deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deployment test runner
        run: pip install pytest==8.3.4
      - name: Check launchers and Compose contracts
        run: |
          bash -n deploy/local/up.sh deploy/production/scripts/deploy.sh
          python -m pytest deploy/production/tests -q
      - name: Build production backend
        run: docker build --target production -t filmos-backend:ci-production backend
      - name: Build production frontend
        run: docker build --build-arg NEXT_PUBLIC_API_URL=/api --build-arg NEXT_PUBLIC_AUTH_PROVIDER=casdoor -t filmos-frontend:ci-production frontend
