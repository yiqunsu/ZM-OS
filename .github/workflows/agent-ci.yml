name: agent-integration

on:
  push:
    branches: [main, development]
    paths: ["backend/**", "frontend/**", ".github/workflows/agent-ci.yml"]
  pull_request:
    branches: [main, development]
    paths: ["backend/**", "frontend/**", ".github/workflows/agent-ci.yml"]

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: filmos
          POSTGRES_PASSWORD: filmos
          POSTGRES_DB: filmos
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U filmos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend test runtime
        run: |
          python -m venv backend/venv
          backend/venv/bin/pip install -r backend/requirements-dev.txt
      - name: Install frontend and browser
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Browser protocol regression
        working-directory: frontend
        run: npm run test:agent
      - name: Full stack with local HTTP model fixture
        working-directory: frontend
        run: npm run test:agent:fullstack
      - name: Keep failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: agent-integration-failure
          path: frontend/test-results/
          retention-days: 7
