name: release-policy
on:
  push:
    branches: [development]
  pull_request:
    branches: [main, development]
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]
permissions:
  contents: read
jobs:
  policy:
    name: release-policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts/release -p 'test_*.py'
      - run: python scripts/release/version.py check
      - name: Validate release PR
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: python scripts/release/check_pr.py
