services:
  postgres:
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U filmos -d filmos"]
      interval: 2s
      timeout: 2s
      retries: 30
    networks:
      - default
      - local_auth_database

  casdoor-db-init:
    image: postgres:16
    restart: "no"
    environment:
      PGHOST: postgres
      PGUSER: filmos
      PGPASSWORD: filmos
      PGDATABASE: postgres
      CASDOOR_DB: ${CASDOOR_DB:?Set CASDOOR_DB in .env.local-auth}
      CASDOOR_DB_USER: ${CASDOOR_DB_USER:?Set CASDOOR_DB_USER in .env.local-auth}
      CASDOOR_DB_PASSWORD: ${CASDOOR_DB_PASSWORD:?Set CASDOOR_DB_PASSWORD in .env.local-auth}
    volumes:
      - ./deploy/local-auth/init-database.sh:/init-database.sh:ro
    command: ["bash", "/init-database.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - local_auth_database

  casdoor-config:
    image: python:3.12-alpine
    restart: "no"
    environment:
      CASDOOR_RUNTIME_DIR: /runtime
      CASDOOR_ISSUER: ${CASDOOR_ISSUER:?Set CASDOOR_ISSUER in .env.local-auth}
      CASDOOR_DB: ${CASDOOR_DB:?Set CASDOOR_DB in .env.local-auth}
      CASDOOR_DB_USER: ${CASDOOR_DB_USER:?Set CASDOOR_DB_USER in .env.local-auth}
      CASDOOR_DB_PASSWORD: ${CASDOOR_DB_PASSWORD:?Set CASDOOR_DB_PASSWORD in .env.local-auth}
      CASDOOR_CLIENT_ID: ${CASDOOR_CLIENT_ID:?Set CASDOOR_CLIENT_ID in .env.local-auth}
      CASDOOR_CLIENT_SECRET: ${CASDOOR_CLIENT_SECRET:?Set CASDOOR_CLIENT_SECRET in .env.local-auth}
      CASDOOR_REDIRECT_URI: ${CASDOOR_REDIRECT_URI:?Set CASDOOR_REDIRECT_URI in .env.local-auth}
      CASDOOR_ADMIN_EMAIL: ${CASDOOR_ADMIN_EMAIL:?Set CASDOOR_ADMIN_EMAIL in .env.local-auth}
      CASDOOR_ADMIN_PASSWORD: ${CASDOOR_ADMIN_PASSWORD:?Set CASDOOR_ADMIN_PASSWORD in .env.local-auth}
      CASDOOR_OWNER_NAME: ${CASDOOR_OWNER_NAME:?Set CASDOOR_OWNER_NAME in .env.local-auth}
      CASDOOR_OWNER_EMAIL: ${CASDOOR_OWNER_EMAIL:?Set CASDOOR_OWNER_EMAIL in .env.local-auth}
      CASDOOR_OWNER_PASSWORD: ${CASDOOR_OWNER_PASSWORD:?Set CASDOOR_OWNER_PASSWORD in .env.local-auth}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:?Set APP_PUBLIC_URL in .env.local-auth}
    volumes:
      - ./deploy/production/scripts/prepare-casdoor.py:/prepare-casdoor.py:ro
      - ./.data/local-casdoor:/runtime
    command: ["python", "/prepare-casdoor.py"]

  casdoor:
    image: casbin/casdoor:3.125.0@sha256:d7658640aba370495e59dc1464756d2ae7ec66576203b9de0040e9cc37793607
    restart: unless-stopped
    init: true
    environment:
      RUNNING_IN_DOCKER: "true"
    volumes:
      - ./.data/local-casdoor/app.conf:/conf/app.conf:ro
      - ./.data/local-casdoor/init_data.json:/init_data.json:ro
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      casdoor-db-init:
        condition: service_completed_successfully
      casdoor-config:
        condition: service_completed_successfully
    networks:
      - local_auth_application
      - local_auth_database
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    environment:
      AUTH_PROVIDER: casdoor
      CASDOOR_ISSUER: ${CASDOOR_ISSUER:?Set CASDOOR_ISSUER in .env.local-auth}
      CASDOOR_CLIENT_ID: ${CASDOOR_CLIENT_ID:?Set CASDOOR_CLIENT_ID in .env.local-auth}
      CASDOOR_JWKS_URL: http://casdoor:8000/.well-known/jwks
      CASDOOR_ORGANIZATION: filmos
    depends_on:
      casdoor:
        condition: service_healthy
    networks:
      - default
      - local_auth_application

  frontend:
    build:
      args:
        NEXT_PUBLIC_AUTH_PROVIDER: casdoor
        NEXT_PUBLIC_CASDOOR_URL: ${CASDOOR_ISSUER:?Set CASDOOR_ISSUER in .env.local-auth}
        NEXT_PUBLIC_CASDOOR_CLIENT_ID: ${CASDOOR_CLIENT_ID:?Set CASDOOR_CLIENT_ID in .env.local-auth}
    environment:
      AUTH_PROVIDER: casdoor
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env.local-auth}
      AUTH_URL: ${APP_PUBLIC_URL:?Set APP_PUBLIC_URL in .env.local-auth}
      AUTH_TRUST_HOST: "true"
      BACKEND_API_URL: http://backend:8000
      CASDOOR_ISSUER: ${CASDOOR_ISSUER:?Set CASDOOR_ISSUER in .env.local-auth}
      CASDOOR_PUBLIC_URL: ${CASDOOR_ISSUER:?Set CASDOOR_ISSUER in .env.local-auth}
      CASDOOR_INTERNAL_URL: http://casdoor:8000
      CASDOOR_CLIENT_ID: ${CASDOOR_CLIENT_ID:?Set CASDOOR_CLIENT_ID in .env.local-auth}
      CASDOOR_CLIENT_SECRET: ${CASDOOR_CLIENT_SECRET:?Set CASDOOR_CLIENT_SECRET in .env.local-auth}
      NEXT_PUBLIC_AUTH_PROVIDER: casdoor
      NEXT_PUBLIC_CASDOOR_URL: ${CASDOOR_ISSUER:?Set CASDOOR_ISSUER in .env.local-auth}
      NEXT_PUBLIC_CASDOOR_CLIENT_ID: ${CASDOOR_CLIENT_ID:?Set CASDOOR_CLIENT_ID in .env.local-auth}
    depends_on:
      casdoor:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - default
      - local_auth_application

networks:
  local_auth_application:
    internal: true
  local_auth_database:
    internal: true
